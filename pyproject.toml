[project]
name = "lead-response-agent"
version = "1.0.0"
description = "AI agent that triages inbound rental inquiries, drafts replies, and gates CRM writes behind human approval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.80",
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:agent.*"]

[tool.coverage.run]
source = ["agent"]
omit = ["agent/eval.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
